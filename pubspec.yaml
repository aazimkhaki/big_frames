name: big_frames
description: A production-quality cross-platform Flutter desktop application for Big Frames S3-compatible object storage.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  
  # S3 Protocol & Network
  minio: ^3.5.8
  http: ^1.2.1
  cross_file: ^0.3.4
  
  # Storage & Persistence
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  sqlite3: ^2.4.2
  path: ^1.9.0
  
  # Desktop Integration
  desktop_drop: ^0.4.4
  file_selector: ^1.0.3
  path_provider: ^2.1.3
  
  # UI & Utilities
  flutter_svg: ^2.0.10
  uuid: ^4.4.0
  intl: ^0.19.0
  collection: ^1.18.0
  mime: ^1.0.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
